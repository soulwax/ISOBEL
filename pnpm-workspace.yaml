# File: pnpm-workspace.yaml

packages:
  - .
  - web

overrides:
  '@types/ws': 8.18.1

# Prisma 7 generates a client under node_modules/.prisma that resolves some
# runtime packages (e.g. @prisma/client-runtime-utils) from the project root.
# pnpm's isolated linker keeps them private, breaking oxmgr/PM2/Docker runs.
# pnpm 12 reads this from pnpm-workspace.yaml, NOT .npmrc.
publicHoistPattern:
  - '@prisma/*'

allowBuilds:
  '@discordjs/opus': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  workerd: true

onlyBuiltDependencies:
  - '@discordjs/opus'
  - '@prisma/engines'
  - esbuild
  - prisma
